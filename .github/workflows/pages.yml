name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vcweb-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-bindgen CLI
        run: |
          set -eu
          version=$(awk '/^name = "wasm-bindgen"$/{found=1} found && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen pinned to $version (from Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Bindgen
        run: |
          wasm-bindgen \
            --target web \
            --no-typescript \
            --out-dir www/pkg \
            --out-name vice_city_web \
            target/wasm32-unknown-unknown/release/vice_city_web.wasm

      # `www/assets` is a symlink to `../assets` for local development, and
      # actions/upload-pages-artifact does NOT follow symlinks -- the archive
      # would ship a dangling link and every `assets/*.json` fetch would 404
      # on Pages. Replace it with a real directory of regular files.
      - name: Stage assets into www
        run: |
          set -eu
          rm -f www/assets
          mkdir -p www/assets
          cp assets/manifest.json assets/*.json www/assets/
          test "$(find www/assets -name '*.json' | wc -l)" -ge 70
          echo "staged $(find www/assets -name '*.json' | wc -l) json files"

      - name: Verify bundle exists
        run: |
          set -eu
          test -s www/pkg/vice_city_web_bg.wasm
          test -s www/pkg/vice_city_web.js
          test -s www/index.html
          test -s www/assets/manifest.json
          ls -la www/pkg/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
